name: cokacremote

services:
  workmachine:
    build:
      context: ..
      dockerfile: tunneling/Dockerfile
      args:
        TIMEZONE: "${TZ:-UTC}"
    image: "${WORKMACHINE_IMAGE:-workmachine:local}"
    container_name: workmachine
    hostname: workmachine
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3999}:2999"
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:?Set MCP_PUBLIC_URL in .env}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_OAUTH_ENABLED: "${MCP_OAUTH_ENABLED:-true}"
      MCP_OAUTH_APPROVAL_KEY: "${MCP_OAUTH_APPROVAL_KEY:-}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      WINDOWS_RUNNER_QUEUE_DIR: "${WINDOWS_RUNNER_CONTAINER_DIR:-/chatlocalwork-runtime/windows-runner}"
      WINDOWS_RUNNER_TIMEOUT_MS: "${WINDOWS_RUNNER_TIMEOUT_MS:-120000}"
    volumes:
      - type: bind
        source: "${SHARED_PATH:?Set SHARED_PATH in .env}"
        target: /shared
      - type: bind
        source: "${WINDOWS_RUNNER_HOST_DIR:?Set WINDOWS_RUNNER_HOST_DIR}"
        target: "${WINDOWS_RUNNER_CONTAINER_DIR:-/chatlocalwork-runtime/windows-runner}"
      - type: volume
        source: cokacremote-state
        target: /var/lib/cokacremote
    stop_grace_period: 30s

volumes:
  cokacremote-state:
